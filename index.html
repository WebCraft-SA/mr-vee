<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>No More Tests</title>

  <style>
    :root {
      --bg: #0b0b0f;
      --card: #15151c;
      --card-2: #1c1c25;
      --text: #f5f5f7;
      --accent: #d8a7b1;
      --border: rgba(255,255,255,0.09);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      background:
        radial-gradient(
          circle at top,
          #24202a 0%,
          var(--bg) 50%
        );

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    .card {
      width: 100%;
      max-width: 540px;

      background: rgba(21, 21, 28, 0.96);

      border: 1px solid var(--border);
      border-radius: 28px;

      padding: 40px 28px;

      box-shadow:
        0 25px 80px rgba(0,0,0,0.45);

      animation: appear 0.6s ease;
    }

    .eyebrow {
      color: var(--accent);

      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;

      margin-bottom: 18px;

      text-align: center;
    }

    h1 {
      margin: 0 0 28px;

      font-size: clamp(30px, 8vw, 44px);

      line-height: 1.08;

      font-weight: 650;

      letter-spacing: -0.04em;

      text-align: center;
    }

    .message {
      padding: 24px;

      background: var(--card-2);

      border: 1px solid var(--border);

      border-radius: 18px;

      color: var(--text);

      font-size: 17px;

      line-height: 1.7;
    }

    .closing {
      margin-top: 28px;

      color: var(--accent);

      font-size: 18px;

      font-weight: 600;

      text-align: center;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 420px) {
      .card {
        padding: 34px 20px;
        border-radius: 24px;
      }
    }
  </style>

</head>

<body>

  <main class="card">

<div class="eyebrow">
  Okay Mr V
</div>

<h1>
  No More Tests
</h1>

<div class="message">

  😂😂 Okay Mr V I hear you... No more tests.

  <br><br>

  But in my defence you completely misunderstood
  Request 3 😭

  <br><br>

  I’m sorry once again.

</div>

<div class="closing">
  Respect for the bagolo has been noted 😂
</div>

  </main>

</body>
</html>
