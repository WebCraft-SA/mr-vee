<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>One More Thing</title>

  <style>
    :root {
      --bg: #0b0b0f;
      --card: #15151c;
      --card-2: #1c1c25;
      --text: #f5f5f7;
      --muted: #9898a5;
      --accent: #d8a7b1;
      --border: rgba(255,255,255,0.09);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      background:
        radial-gradient(
          circle at top,
          #24202a 0%,
          var(--bg) 50%
        );

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    .card {
      width: 100%;
      max-width: 520px;

      background: rgba(21, 21, 28, 0.96);

      border: 1px solid var(--border);
      border-radius: 28px;

      padding: 38px 28px;

      text-align: center;

      box-shadow:
        0 25px 80px rgba(0,0,0,0.45);

      animation: appear 0.6s ease;
    }

    .eyebrow {
      color: var(--accent);

      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;

      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 16px;

      font-size: clamp(28px, 7vw, 40px);

      line-height: 1.1;

      font-weight: 650;

      letter-spacing: -0.03em;
    }

    .intro {
      margin: 0 auto 24px;

      max-width: 410px;

      color: var(--muted);

      font-size: 16px;

      line-height: 1.65;
    }

    textarea {
      width: 100%;
      min-height: 150px;

      padding: 16px;

      resize: vertical;

      background: var(--card-2);

      color: var(--text);

      border: 1px solid var(--border);

      border-radius: 16px;

      outline: none;

      font-family: inherit;

      font-size: 16px;

      line-height: 1.5;
    }

    textarea::placeholder {
      color: #777784;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    button {
      width: 100%;

      margin-top: 16px;

      padding: 14px 20px;

      border: none;

      border-radius: 14px;

      background: var(--accent);

      color: #171218;

      font-size: 16px;

      font-weight: 650;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .note {
      margin-top: 14px;

      color: var(--muted);

      font-size: 13px;
    }

    #status {
      margin-top: 14px;

      font-size: 14px;

      color: var(--accent);

      display: none;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 420px) {
      .card {
        padding: 32px 20px;
        border-radius: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="eyebrow">
      One more thing
    </div>

    <h1>
      Before you go back to normal typing...
    </h1>

    <p class="intro">
      Lemme give you a little show of allowing you to type something
      if there’s anything you would like to say.
    </p>

    <textarea
      id="message"
      placeholder="Type whatever you would like to say..."
    ></textarea>

    <button
      id="sendButton"
      type="button"
      onclick="sendMessage()"
    >
      Send
    </button>

    <div id="status"></div>

    <div class="note">
      I’m listening.
    </div>

  </main>

  <script>
    async function sendMessage() {
      const messageBox = document.getElementById("message");
      const button = document.getElementById("sendButton");
      const status = document.getElementById("status");

      const message = messageBox.value.trim();

      if (!message) {
        return;
      }

      button.disabled = true;

      try {
        const response = await fetch(
          "https://formspree.io/f/mdekoeyv",
          {
            method: "POST",
            headers: {
              "Accept": "application/json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              Message: message
            })
          }
        );

        if (!response.ok) {
          throw new Error("Message was not sent");
        }

        messageBox.value = "";

        status.textContent = "Sent.";
        status.style.display = "block";

      } catch (error) {
        status.textContent = "Something went wrong. Please try again.";
        status.style.display = "block";
      }

      button.disabled = false;
    }
  </script>

</body>
</html>
